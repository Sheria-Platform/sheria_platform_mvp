# docker-compose.yml
version: '3.8'

services:
  # 1. Postgres (Chat History)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Redis (Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 3. Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Neo4j (Graph DB)
  neo4j:
    image: neo4j:5.16.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # 5. MinIO (S3 Mock) - Optional for full offline dev
  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Production security settings
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://0.0.0.0:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://0.0.0.0:9000}
      
      # Performance and reliability settings
      MINIO_CACHE: "on"
      MINIO_CACHE_DRIVES: "/data/cache"
      MINIO_CACHE_EXCLUDE: "*.pdf"
      MINIO_CACHE_QUOTA: "80"
      # Health check settings
      #MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      # Additional security headers
      MINIO_API_CORS_ALLOW_ORIGIN: "*"  
    volumes:
      - minio-data:/data

  # 6. Ollama (Local LLMs) server GPU support
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434" # Exposes the Ollama API port
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # This volume is where Ollama stores its models and data
      - ollama:/root/.ollama

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  minio-data:
  redis-data:
  ollama:

