# docker-compose.yml
version: '3.8'

# GPU/CPU Ollama variants share these blocks via YAML anchors (see deploy/local_dev
# for the multi-node version of this same pattern).
x-ollama-base: &ollama-base
  image: ollama/ollama:latest
  ports:
    - "${OLLAMA_PORT:-11434}:11434"
  volumes:
    - ollama:/root/.ollama
  restart: unless-stopped
  # ollama/ollama ships no curl/wget — bash's /dev/tcp is the only HTTP-probe
  # tool actually present, hence the raw TCP check below.
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/11434' || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3

# GPU device reservation — merged only into the gpu-profile service.
# capabilities MUST be [gpu] (previous [cpu] was a copy-paste bug that made
# the nvidia device reservation meaningless).
x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${OLLAMA_NUM_GPU:-all}
            capabilities: [gpu]

services:
  # 1. Postgres (Case Metadata & Judicial Decisions)
  postgres:
    image: postgres:15-alpine
    container_name: sheria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis (Semantic Cache)
  redis:
    image: redis:7-alpine
    container_name: sheria-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. Qdrant (Vector Database for Kenya Law Reports)
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.7.3}
    container_name: sheria-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"  # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # The qdrant/qdrant image ships no curl/wget — bash's /dev/tcp is the
    # only HTTP-probe tool actually present, hence the raw TCP check below.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Neo4j (Citation Graph & Legal Relationships)
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.16.0-community}
    container_name: sheria-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_MEMORY_PAGECACHE_SIZE:-1G}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP
      - "${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 5. MinIO (S3-Compatible Storage for Court Documents)
  minio:
    image: minio/minio
    container_name: sheria-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
#       # Production security settings
#       MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://0.0.0.0:9001}
#       MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://0.0.0.0:9000}

#       # Performance and reliability settings
#       MINIO_CACHE: "on"
#       MINIO_CACHE_DRIVES: "/data/cache"
#       MINIO_CACHE_EXCLUDE: "*.pdf"
#       MINIO_CACHE_QUOTA: "80"
      # Health check settings
      #MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      # Additional security headers
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 6. Ollama (Local LLM for Embeddings, Graph Extraction & API Inference)
  # Profile-gated: exactly one of these two runs, selected by COMPOSE_PROFILES
  # (cpu|gpu) in .env. Both share container_name + the "ollama" DNS alias so
  # dependents can always reach it at http://ollama:11434 regardless of which
  # profile is active. The gpu variant is the ONLY place the nvidia driver is
  # referenced — with COMPOSE_PROFILES=cpu (the default) the nvidia driver is
  # never resolved, so this works on machines without nvidia-container-toolkit.
  ollama:
    <<:
      - *ollama-base
      - *gpu-resources
    container_name: sheria-ollama
    profiles: [gpu]
    networks:
      default:
        aliases: [ollama]

  ollama-cpu:
    <<: *ollama-base
    container_name: sheria-ollama
    profiles: [cpu]
    networks:
      default:
        aliases: [ollama]

  # 7. Ollama Nginx Proxy (Load Balancer for Remote Ollama Cluster)
  # Used by pipelines/ingestion/ which targets separate remote endpoints
  # NOTE: depends_on "ollama" intentionally omitted. "ollama" is profile-gated
  # (profiles: [gpu]/[cpu] above) and this service is not — Compose errors if a
  # profile-agnostic service depends_on a service outside the active profile.
  # nginx reaches Ollama via the "ollama" DNS alias at runtime instead.
  # Gated behind the "proxy" profile (opt-in only): ./nginx.conf proxies
  # ports 11435-11437 to this stack's single `ollama` node (see the file's
  # own header) — it's a thinner shim than deploy/local_dev/'s 3-node
  # cluster balancer, for local testing against ingestion's remote-cluster
  # port scheme. Run `docker compose --profile proxy up -d` to use it.
  ollama-proxy:
    image: nginx:alpine
    container_name: sheria-ollama-proxy
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - "11435:11435"  # LLM endpoint
      - "11436:11436"  # Embedding endpoint
      - "11437:11437"  # Reranker endpoint
      - "8081:8080"    # Status/health endpoint (changed to 8081 to avoid conflict)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 8. Sheria API (FastAPI Agentic RAG Service)
  sheria-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: sheria-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # App
      ENV: ${ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-rag_db}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kenya_law_reports}
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      # Ollama (replaces Ray Serve endpoints)
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      # MinIO (routes/profile.py avatar upload; readiness probe)
      MINIO_SERVER_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-case-files-dev}
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # SMTP — routes activation emails to MailHog in dev
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@judiciary.go.ke}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    # "ollama" is profile-gated (profiles: [gpu]/[cpu]); a non-profiled
    # service can't depends_on it directly, so it's intentionally omitted
    # here (matches the ollama-proxy/open-webui services below) — the API
    # still reaches it via the "ollama" DNS alias at runtime.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 9. Open WebUI (Web Interface for Ollama - Development)
  # NOTE: depends_on "ollama" intentionally omitted — see the "ollama-proxy"
  # comment above. OLLAMA_BASE_URL below still resolves via the "ollama"
  # DNS alias at runtime regardless of which profile is active.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sheria-open-webui
    ports:
      - "${OPEN_WEBUI_PORT:-3030}:8080"
    environment:
      # Ollama connection
      OLLAMA_BASE_URL: ${OLLAMA_HOST:-http://ollama:11434}
      # Security
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-to-random-string}
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ragadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-rag_db}
      # Redis cache
      REDIS_URL: redis://redis:6379/1
      # Authentication
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-user}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      # RAG Configuration
      ENABLE_RAG: ${ENABLE_RAG:-true}
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE:-ollama}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      # Vector DB
      VECTOR_DB: qdrant
      # Renamed from QDRANT_URL: the open-webui `main` image now reads
      # QDRANT_URI (confirmed via its qdrant_multitenancy client raising
      # "QDRANT_URI is not set" at startup with the old name).
      QDRANT_URI: http://qdrant:6333
      # Web Search
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      # UI Customization
      WEBUI_NAME: ${WEBUI_NAME:-Sheria Legal Research}
      # CORS
      CORS_ALLOW_ORIGIN: "*"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - postgres
      - qdrant
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # 10. MailHog (Local SMTP for Dev — captures outgoing activation emails)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: sheria-mailhog
    ports:
      - "1025:1025"   # SMTP — point SMTP_HOST=mailhog, SMTP_PORT=1025
      - "8025:8025"   # Web UI — http://localhost:8025 to inspect emails
    restart: unless-stopped

  # 11. Sheria UI (Next.js Frontend — dev mode with hot reload)
  # NEXT_PUBLIC_API_URL is read by *browser*-side code (baked into the JS
  # bundle) so it must be a host-reachable URL, not the "sheria-api" Docker
  # DNS name — the browser runs on the host, outside this network. API_URL
  # (no NEXT_PUBLIC_ prefix) is read by the Next.js server's own route
  # handlers (app/api/proxy/*, app/api/auth/*), which run inside the
  # container and do need the Docker DNS name.
  sheria-ui:
    build:
      context: ./user_interface
      dockerfile: Dockerfile
    container_name: sheria-ui
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      API_URL: http://sheria-api:8000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    volumes:
      - ./user_interface:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      sheria-api:
        condition: service_healthy
    restart: unless-stopped


volumes:
  pg_data:
    name: sheria-pg-data
  qdrant_data:
    name: sheria-qdrant-data
  neo4j_data:
    name: sheria-neo4j-data
  minio-data:
    name: sheria-minio-data
  redis-data:
    name: sheria-redis-data
  ollama:
    name: sheria-ollama
  open-webui:
    name: sheria-open-webui

networks:
  default:
    name: sheria-network
