# docker-compose.yml
version: '3.8'

services:
  # 1. Postgres (Chat History)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Redis (Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 3. Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Neo4j (Graph DB)
  neo4j:
    image: neo4j:5.16.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # 5. MinIO (S3 Mock) - Optional for full offline dev
  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Production security settings
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://0.0.0.0:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://0.0.0.0:9000}

      # Performance and reliability settings
      MINIO_CACHE: "on"
      MINIO_CACHE_DRIVES: "/data/cache"
      MINIO_CACHE_EXCLUDE: "*.pdf"
      MINIO_CACHE_QUOTA: "80"
      # Health check settings
      #MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      # Additional security headers
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data

  # 6. Ollama (Local LLMs) server GPU support
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11433:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro   # mount your script read-only
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    #TODO: Configure health checks
    # override to run our script
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/11434' || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 6
    #   start_period: 30s

  # 7. Open WebUI (Web interface for Ollama)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Ollama connection
      OLLAMA_BASE_URL: http://ollama:11434

      # Security
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-to-random-string}

      # Database (optional - uses SQLite by default, can use your Postgres)
      # DATABASE_URL: postgresql://ragadmin:changeme@postgres:5432/rag_db

      # Redis cache (optional - can leverage your existing Redis)
      # REDIS_URL: redis://redis:6379/1

      # Authentication
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-user}

      # RAG Configuration
      ENABLE_RAG: ${ENABLE_RAG:-true}
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}

      # Vector DB - Can integrate with your Qdrant if needed
      # VECTOR_DB: qdrant
      # QDRANT_URL: http://qdrant:6333

      # Web Search (optional)
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}

      # UI Customization
      WEBUI_NAME: ${WEBUI_NAME:-Sheria Platform Chat}

      # CORS (for local dev)
      CORS_ALLOW_ORIGIN: "*"

    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  minio-data:
  redis-data:
  ollama:
  open-webui: