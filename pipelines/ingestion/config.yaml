# pipelines/ingestion/config.yaml

chunking:
  # 512 tokens is the "Goldilocks" zone for RAG (enough context, not too much noise)
  chunk_size: 512

  # Overlap ensures context isn't lost at the split point
  chunk_overlap: 50

  # Separators for recursive splitting (Paragraphs -> Sentences -> Words)
  separators: ["\n\n", "\n", ' ', '']

embedding:
  # Ollama configuration
  # Host endpoint (can be overridden by OLLAMA_HOST env var)
  host: http://localhost:11434

  # Embedding model to use (can be overridden by OLLAMA_EMBED_MODEL env var)
  # Recommended models: nomic-embed-text, mxbai-embed-large, all-minilm
  model: nomic-embed-text

  # Batch size for processing (Ollama processes sequentially)
  batch_size: 100

llm:
  # Ollama LLM configuration for graph extraction
  # Host endpoint (can be overridden by OLLAMA_HOST env var)
  host: http://localhost:11434

  # LLM model to use (can be overridden by OLLAMA_LLM_MODEL env var)
  # Recommended models: llama3, llama3.1, mistral, qwen2.5
  model: llama3

  # Temperature for deterministic output
  temperature: 0.0

  # Max tokens for generation
  max_tokens: 1024

graph:
  # Controls the LLM extraction speed vs cost
  concurrency: 10

  # If true, strictly adheres to the schema.py ontology
  enforce_schema: true

vector_db:
  # Collection name for Kenya Law Reports
  collection_name: kenya_law_reports

  # Distance metric for similarity search
  distance_metric: Cosine
