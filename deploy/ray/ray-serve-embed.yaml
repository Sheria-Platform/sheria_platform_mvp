# deploy/ray/ray-serve-embed.yaml
apiVersion: ray.io/v1

kind: RayService

metadata:
  name: embed-service

spec:
  serveConfigV2: |
    applications:
      - name: bge-m3
        import_path: services.api.app.models.embedding_engine:app
        deployments:
          - name: EmbedDeployment
            autoscaling_config:
              min_replicas: 1
              max_replicas: 5
            ray_actor_options:
              num_gpus: 0.5 # Share GPU (2 models per card)