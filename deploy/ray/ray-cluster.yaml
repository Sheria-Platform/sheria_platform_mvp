# deploy/ray/ray-cluster.yaml
apiVersion: ray.io/v1

kind: RayCluster

metadata:
  name: rag-ray-cluster

spec:
  rayVersion: '2.9.0'

  headGroupSpec:
    serviceType: ClusterIP

    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0-py310-gpu
          resources: { requests: { cpu: "2", memory: "8Gi" } }

workerGroupSpecs:

  # GPU Workers for Inference
  - groupName: gpu-workers
    replicas: 0
    minReplicas: 0
    maxReplicas: 20

    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0-py310-gpu

          resources:
            limits: { nvidia.com/gpu: 1 }
            requests: { nvidia.com/gpu: 1 }

        # Taint toleration ensures these pods ONLY land on GPU nodes
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
