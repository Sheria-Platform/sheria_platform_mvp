# =============================================================================
# nginx.conf — Ollama Dev Cluster Load Balancer
# deploy/local_dev/nginx.conf
# =============================================================================
# Architecture (Docker Compose service names — no hardcoded IPs):
#   ollama-llm:11434   — LLM node 1 (qwen3:8b / qwen2.5:3b)
#   ollama-llm2:11434  — LLM node 2
#   ollama-llm3:11434  — LLM node 3
#   ollama-embed:11434 — Embedding node (nomic-embed-text)
#   ollama-rerank:11434— Rerank node (Qwen3-Reranker-4B / qwen2.5:3b)
#
# Port mapping (container-internal → exposed on host via docker-compose.yml):
#   :11433  →  LLM backend      (round-robin: llm + llm2 + llm3)
#   :11436  →  Embed backend    (least_conn: embed node)
#   :11437  →  Rerank backend   (least_conn: rerank node)
#   :8080   →  Health / status  (nginx stub_status + probe endpoints)
#
# NOTE: This file is ONLY for the Docker dev cluster.
#       For the bare-metal remote cluster, see:
#       resources/script_config/nginx.conf
# =============================================================================

# -----------------------------------------------------------------------------
# WORKER PROCESSES
# -----------------------------------------------------------------------------
worker_processes      auto;          # one per CPU core
worker_rlimit_nofile  65535;         # max open files per worker

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# EVENTS
# -----------------------------------------------------------------------------
events {
    worker_connections  4096;
    multi_accept        on;
}

# -----------------------------------------------------------------------------
# HTTP BLOCK — shared settings
# -----------------------------------------------------------------------------
http {

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time '
                      'uct=$upstream_connect_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    # ── Timeouts — CRITICAL for LLM inference and batch embedding ────────────
    # LLM inference on CPU can exceed 60s per request; GPU is 5–20s.
    # Embed batches of 50 chunks at ~8-9s/req on CPU can queue past 300s.
    # proxy_read_timeout / proxy_send_timeout are overridden per-location
    # below; these globals cover any location that doesn't set its own.
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
    send_timeout            300s;

    # ── Buffer sizing ─────────────────────────────────────────────────────────
    # LLM streaming responses can be large; increase buffers to avoid
    # disk spill on long generations.
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # ── Headers ───────────────────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";  # enable keepalive to upstream

    # ── Streaming (required for Ollama stream:true) ───────────────────────────
    # Per-location proxy_buffering off is set for streaming endpoints below.
    proxy_cache             off;

    # =========================================================================
    # UPSTREAM: LLM — round-robin across 3 nodes
    # =========================================================================
    # Default algorithm: round-robin (no directive needed).
    # 3 nodes = 3 parallel in-flight generations without queuing.
    # Graph extraction pipeline fires concurrent LLM + embed calls — 3 nodes
    # prevent head-of-line blocking on a single inference process.
    # max_fails=3 fail_timeout=30s: after 3 failures in 30s window,
    # node is marked unavailable for 30s then retried.
    upstream ollama_llm {
        keepalive           32;

        server  ollama-llm:11434    max_fails=3  fail_timeout=30s;
        server  ollama-llm2:11434   max_fails=3  fail_timeout=30s;
        server  ollama-llm3:11434   max_fails=3  fail_timeout=30s;
    }

    # =========================================================================
    # UPSTREAM: Embeddings — least_conn to embed node
    # =========================================================================
    # least_conn: routes to whichever backend has fewest active connections.
    # Better than round-robin for embeddings because batch sizes vary widely
    # (1 query vs 100-chunk ingestion batch).
    #
    # max_fails=0: never mark the backend as unavailable.
    # A slow response under CPU load is NOT a failure — Ollama is just queuing
    # requests internally (OLLAMA_MAX_QUEUE=256/1024). Marking it failed would
    # cause nginx to drop the entire queue and return 502 to all waiting clients.
    # keepalive=64: hold enough idle connections to absorb ingestion batch bursts
    # (batch_size=50 concurrent requests need ≥50 live keepalive slots).
    upstream ollama_embed {
        least_conn;
        keepalive           64;

        server  ollama-embed:11434   max_fails=0;
    }

    # =========================================================================
    # UPSTREAM: Reranker — least_conn to rerank node
    # =========================================================================
    upstream ollama_rerank {
        least_conn;
        keepalive           32;

        server  ollama-rerank:11434  max_fails=0;
    }

    # =========================================================================
    # SERVER BLOCK: LLM — port 11433
    # =========================================================================
    server {
        listen      11433;
        server_name _;

        # ── Streaming: disable buffering for stream:true responses ────────────
        location /api/chat {
            proxy_pass          http://ollama_llm;
            proxy_buffering     off;       # required for SSE / token streaming
            proxy_read_timeout  180s;
            proxy_send_timeout  180s;
            chunked_transfer_encoding on;
        }

        # ── Non-streaming generate endpoint ──────────────────────────────────
        location /api/generate {
            proxy_pass          http://ollama_llm;
            proxy_buffering     off;
            proxy_read_timeout  180s;
        }

        # ── Model management (pull, list, delete) ─────────────────────────────
        location /api/ {
            proxy_pass          http://ollama_llm;
            proxy_read_timeout  300s;      # model pulls can be slow
        }
    }

    # =========================================================================
    # SERVER BLOCK: Embeddings — port 11436
    # =========================================================================
    server {
        listen      11436;
        server_name _;

        location /api/embeddings {
            proxy_pass              http://ollama_embed;
            proxy_buffering         on;    # embeddings are not streamed
            proxy_read_timeout      300s;  # 5 min — CPU batch of 50 @ 8-9s/req = ~450s worst case
            proxy_send_timeout      300s;
            proxy_next_upstream     off;   # queue, don't retry — retry causes duplicate embeddings
        }

        # Alias endpoint (Ollama also accepts /api/embed)
        location /api/embed {
            proxy_pass              http://ollama_embed;
            proxy_buffering         on;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/ {
            proxy_pass              http://ollama_embed;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Reranker — port 11437
    # =========================================================================
    # NOTE: Ollama has no native /api/rerank endpoint.
    # The reranker client uses /api/embeddings to compute cosine similarity,
    # or /api/chat to prompt Qwen3-Reranker-4B for relevance scores.
    server {
        listen      11437;
        server_name _;

        # Similarity scoring via embeddings (primary rerank method)
        location /api/embeddings {
            proxy_pass              http://ollama_rerank;
            proxy_buffering         on;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/embed {
            proxy_pass              http://ollama_rerank;
            proxy_buffering         on;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        # Chat-based reranking (prompt model to score candidate pairs)
        location /api/chat {
            proxy_pass              http://ollama_rerank;
            proxy_buffering         off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/ {
            proxy_pass              http://ollama_rerank;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Health / Status — port 8080
    # =========================================================================
    server {
        listen      8080;
        server_name _;

        # ── Simple health probe (returns 200 OK) ─────────────────────────────
        # Used by docker-compose healthcheck and external monitoring.
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Nginx stub status (connection metrics) ────────────────────────────
        location /nginx_status {
            stub_status;
            allow   127.0.0.1;
            allow   172.16.0.0/12;   # Docker default bridge range
            deny    all;
        }

        # ── Upstream health probes — check individual backend nodes ───────────
        # Useful for debugging which node is unavailable.
        location /probe/llm {
            proxy_pass          http://ollama_llm/api/tags;
            proxy_read_timeout  5s;
        }

        location /probe/embed {
            proxy_pass          http://ollama_embed/api/tags;
            proxy_read_timeout  5s;
        }

        location /probe/rerank {
            proxy_pass          http://ollama_rerank/api/tags;
            proxy_read_timeout  5s;
        }
    }

}
