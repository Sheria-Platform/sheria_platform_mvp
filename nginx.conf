# =============================================================================
# nginx.conf — Ollama Local Proxy (root docker-compose "proxy" profile)
# =============================================================================
# Mounted into the `ollama-proxy` service (docker-compose.yml, profiles:[proxy]).
# Purpose: let pipelines/ingestion/ target localhost:11435/11436/11437 — the
# same port scheme as the real remote cluster (see pipelines/ingestion/.env.example:
# OLLAMA_LLM_ENDPOINT / OLLAMA_EMBED_ENDPOINT / OLLAMA_RERANK_ENDPOINT) — while
# actually talking to this stack's single `ollama` service on :11434.
#
# This stack only ever runs ONE Ollama container (the `ollama`/`ollama-cpu`
# services share the `ollama` DNS alias — see docker-compose.yml "6. Ollama").
# So unlike deploy/local_dev/nginx.conf (3-node LLM load balancer), every
# upstream here has a single server. If you need real multi-node balancing,
# use deploy/local_dev/ instead.
#
# Port mapping (container-internal, matches docker-compose.yml port list):
#   :11435  →  LLM        (proxies to ollama:11434)
#   :11436  →  Embeddings (proxies to ollama:11434)
#   :11437  →  Reranker   (proxies to ollama:11434, via /api/embeddings)
#   :8080   →  Health / status
# =============================================================================

worker_processes      auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time '
                      'uct=$upstream_connect_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    # LLM inference on CPU can exceed 60s per request; embed batches of 100
    # (see OllamaEmbeddingsClient) can also take a while under load.
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
    send_timeout            300s;

    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";  # enable keepalive to upstream

    proxy_cache             off;

    # =========================================================================
    # UPSTREAM: single Ollama node, reused for LLM / embed / rerank traffic
    # =========================================================================
    upstream ollama_backend {
        keepalive           32;
        server  ollama:11434  max_fails=3  fail_timeout=30s;
    }

    # =========================================================================
    # SERVER BLOCK: LLM — port 11435
    # =========================================================================
    server {
        listen      11435;
        server_name _;

        location /api/chat {
            proxy_pass          http://ollama_backend;
            proxy_buffering     off;       # required for SSE / token streaming
            proxy_read_timeout  180s;
            proxy_send_timeout  180s;
            chunked_transfer_encoding on;
        }

        location /api/generate {
            proxy_pass          http://ollama_backend;
            proxy_buffering     off;
            proxy_read_timeout  180s;
        }

        location /api/ {
            proxy_pass          http://ollama_backend;
            proxy_read_timeout  300s;      # model pulls can be slow
        }
    }

    # =========================================================================
    # SERVER BLOCK: Embeddings — port 11436
    # =========================================================================
    server {
        listen      11436;
        server_name _;

        location /api/embeddings {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;   # queue, don't retry — avoids duplicate embeddings
        }

        location /api/embed {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/ {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Reranker — port 11437
    # =========================================================================
    # Ollama has no native /api/rerank endpoint; the reranker client scores via
    # /api/embeddings (cosine similarity) or prompts a model via /api/chat.
    server {
        listen      11437;
        server_name _;

        location /api/embeddings {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/embed {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_next_upstream     off;
        }

        location /api/chat {
            proxy_pass              http://ollama_backend;
            proxy_buffering         off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        location /api/ {
            proxy_pass              http://ollama_backend;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Health / Status — port 8080 (exposed on host as 8081)
    # =========================================================================
    server {
        listen      8080;
        server_name _;

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            stub_status;
            allow   127.0.0.1;
            allow   172.16.0.0/12;   # Docker default bridge range
            deny    all;
        }

        location /probe/ollama {
            proxy_pass          http://ollama_backend/api/tags;
            proxy_read_timeout  5s;
        }
    }
}
